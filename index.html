<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="theme-color" content="#0E1210"/>
<title>Riding Weather</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --am-green:#5A8F5A;--am-green-bright:#6BA368;--am-green-dim:#3D6B3D;
  --am-green-glow:rgba(91,143,90,0.13);--am-green-text:#9DC99A;
  --sev-green:#4CAF50;--sev-yellow:#F0C040;--sev-orange:#F07820;--sev-red:#E03030;
  --sev-green-bg:rgba(76,175,80,0.10);--sev-yellow-bg:rgba(240,192,64,0.10);
  --sev-orange-bg:rgba(240,120,32,0.10);--sev-red-bg:rgba(224,48,48,0.10);
  --sev-green-border:rgba(76,175,80,0.35);--sev-yellow-border:rgba(240,192,64,0.40);
  --sev-orange-border:rgba(240,120,32,0.45);--sev-red-border:rgba(224,48,48,0.45);
}
[data-theme="dark"]{
  --bg:#0E1210;--surface:#161C18;--surface2:#1C2420;--surface3:#222C27;
  --border:#263028;--border2:#2E3C32;--text:#E8F0EA;--text2:#8FA892;--text3:#506055;
  --input-bg:#131A15;--card-shadow:0 2px 12px rgba(0,0,0,.45);
  --map-filter:brightness(0.82) saturate(0.85);
}
[data-theme="light"]{
  --bg:#F0F4F1;--surface:#FFFFFF;--surface2:#F4F8F5;--surface3:#EAF0EB;
  --border:#C8D8CC;--border2:#B0C8B4;--text:#1A2B1E;--text2:#4A6650;--text3:#7A9880;
  --input-bg:#FAFCFA;--card-shadow:0 2px 12px rgba(0,0,0,.08);--map-filter:none;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;transition:background .2s,color .2s}
body{padding-bottom:60px}

/* Header */
.app-header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:200;box-shadow:var(--card-shadow)}
.app-logo{width:34px;height:34px;background:var(--am-green-dim);border:1px solid var(--am-green);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.app-logo svg{width:18px;height:18px;fill:var(--am-green-text)}
.app-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;letter-spacing:.04em;color:var(--am-green-text)}
.app-sub{font-size:11px;color:var(--text3);margin-top:1px}
.header-right{margin-left:auto}
.theme-btn{background:none;border:1px solid var(--border2);border-radius:6px;padding:5px 9px;font-size:14px;cursor:pointer;color:var(--text2);transition:border-color .15s}
.theme-btn:hover{border-color:var(--am-green)}

/* Main */
.main{padding:14px 14px 0;max-width:600px;margin:0 auto}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--card-shadow)}
.card-title{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}

/* Vehicle tabs */
.vtabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.vtab{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s}
.vtab.active{background:var(--am-green-glow);border-color:var(--am-green)}
.vtab-icon{font-size:20px}
.vtab-label{font-size:13px;font-weight:500;color:var(--text2)}
.vtab.active .vtab-label{color:var(--am-green-text)}

/* Form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg.full{grid-column:1/-1}
.fg label{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.06em;text-transform:uppercase}
.input-row{display:flex;gap:6px;align-items:stretch}
.fg input{width:100%;padding:9px 11px;font-size:14px;background:var(--input-bg);border:1px solid var(--border2);border-radius:7px;color:var(--text);outline:none;-webkit-appearance:none}
.fg input:focus{border-color:var(--am-green);box-shadow:0 0 0 2px var(--am-green-glow)}
.fg input::placeholder{color:var(--text3)}
.fg input[type="date"]::-webkit-calendar-picker-indicator,
.fg input[type="time"]::-webkit-calendar-picker-indicator{filter:invert(0.5);cursor:pointer}
.icon-btn{flex-shrink:0;padding:0 10px;background:var(--surface2);border:1px solid var(--border2);border-radius:7px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;color:var(--text2)}
.icon-btn:hover{border-color:var(--am-green);color:var(--am-green-text)}
.icon-btn.active{border-color:var(--am-green);background:var(--am-green-glow);color:var(--am-green-text)}

/* Autocomplete */
.ac-wrap{position:relative;flex:1}
.ac-drop{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--border2);border-radius:8px;z-index:400;display:none;max-height:210px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.ac-item{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:8px}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item.hi{background:var(--surface2)}
.ac-pin{color:var(--am-green-text);font-size:14px;flex-shrink:0;margin-top:2px}
.ac-main{font-size:13px;color:var(--text);font-weight:500;line-height:1.3}
.ac-sub{font-size:11px;color:var(--text3);margin-top:1px}
.ac-msg{padding:10px 12px;font-size:13px;color:var(--text3);display:flex;align-items:center;gap:8px}
.fav-chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fav-chip{display:flex;align-items:center;gap:5px;padding:4px 10px;background:var(--surface2);border:1px solid var(--border2);border-radius:20px;font-size:12px;color:var(--text2);cursor:pointer;transition:border-color .15s}
.fav-chip:hover{border-color:var(--am-green);color:var(--am-green-text)}
.fav-chip-del{font-size:10px;color:var(--text3);margin-left:2px;line-height:1}

/* Stops — styled properly */
.stops-list{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.stop-row{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border2);border-radius:9px;padding:8px 10px}
.stop-num{font-size:11px;font-weight:600;color:var(--am-green-text);background:var(--am-green-glow);border:1px solid var(--am-green-dim);border-radius:5px;padding:2px 7px;flex-shrink:0;letter-spacing:.03em}
.stop-row .ac-wrap{flex:1}
.stop-row .fg input{background:var(--input-bg);border-color:transparent;border-radius:6px;padding:7px 10px;font-size:13px}
.stop-row .fg input:focus{border-color:var(--am-green)}
.stop-pin-btn{flex-shrink:0;padding:0 8px;height:34px;background:transparent;border:1px solid var(--border2);border-radius:6px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .15s;color:var(--text3)}
.stop-pin-btn:hover{border-color:var(--am-green);color:var(--am-green-text)}
.stop-del{flex-shrink:0;padding:0 8px;height:34px;background:transparent;border:1px solid var(--border2);border-radius:6px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .15s;color:var(--text3)}
.stop-del:hover{border-color:var(--sev-red);color:var(--sev-red)}
.add-stop-btn{display:flex;align-items:center;gap:7px;padding:9px 14px;background:var(--surface2);border:1px dashed var(--border2);border-radius:9px;color:var(--text3);font-size:13px;cursor:pointer;width:100%;justify-content:center;transition:all .15s;font-family:'Inter',sans-serif}
.add-stop-btn:hover{border-color:var(--am-green);color:var(--am-green-text);background:var(--am-green-glow)}
.add-stop-icon{font-size:16px}

/* Buttons */
.btn-primary{width:100%;padding:12px;background:var(--am-green-dim);border:1px solid var(--am-green);border-radius:8px;color:var(--am-green-text);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Inter',sans-serif;transition:all .15s}
.btn-primary:hover{background:var(--am-green);color:#0E1210}
.btn-primary:disabled{background:var(--surface2);border-color:var(--border);color:var(--text3);cursor:not-allowed}

/* Progress bar */
.progress-wrap{display:none;margin-bottom:12px}
.progress-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.progress-title{font-size:12px;font-weight:500;color:var(--text2)}
.progress-count{font-size:12px;color:var(--am-green-text);font-weight:600}
.progress-track{width:100%;height:6px;background:var(--surface2);border-radius:4px;overflow:hidden;border:1px solid var(--border)}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--am-green-dim),var(--am-green-bright));border-radius:4px;transition:width .3s ease;width:0%}
.progress-place{font-size:11px;color:var(--text3);margin-top:5px;min-height:16px}

/* Error */
.err-box{background:var(--sev-red-bg);border:1px solid var(--sev-red-border);border-radius:8px;padding:11px 14px;font-size:13px;color:var(--sev-red);display:none;margin-bottom:12px}

/* Map */
#routeMap{height:240px;border-radius:8px;overflow:hidden;border:1px solid var(--border2);margin-bottom:10px}
.leaflet-tile{filter:var(--map-filter)}
.pin-mode-bar{display:none;background:var(--am-green-glow);border:1px solid var(--am-green);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--am-green-text);text-align:center;margin-bottom:8px}

/* Weather map markers */
.wx-marker{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.wx-bubble{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;border:2.5px solid;box-shadow:0 2px 8px rgba(0,0,0,.45);transition:transform .15s}
.wx-bubble:hover{transform:scale(1.15)}
.wx-bubble.sev-green{background:rgba(76,175,80,0.18);border-color:var(--sev-green)}
.wx-bubble.sev-yellow{background:rgba(240,192,64,0.18);border-color:var(--sev-yellow)}
.wx-bubble.sev-orange{background:rgba(240,120,32,0.18);border-color:var(--sev-orange)}
.wx-bubble.sev-red{background:rgba(224,48,48,0.18);border-color:var(--sev-red)}
.wx-stem{width:2px;height:6px;border-radius:1px;margin-top:-1px}
.wx-stem.sev-green{background:var(--sev-green)}
.wx-stem.sev-yellow{background:var(--sev-yellow)}
.wx-stem.sev-orange{background:var(--sev-orange)}
.wx-stem.sev-red{background:var(--sev-red)}
.wx-popup{font-size:12px;line-height:1.5;min-width:140px}
.wx-popup strong{font-size:13px;display:block;margin-bottom:3px}

/* Route cards */
.route-cards{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.route-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px 13px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:10px}
.route-card:hover{border-color:var(--am-green-dim)}
.route-card.sel{background:var(--am-green-glow);border-color:var(--am-green)}
.rc-badge{font-size:10px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:4px;background:var(--surface);border:1px solid var(--border2);color:var(--text2);flex-shrink:0;white-space:nowrap}
.route-card.sel .rc-badge{background:var(--am-green-dim);border-color:var(--am-green);color:var(--am-green-text)}
.rc-info{flex:1}
.rc-name{font-size:13px;font-weight:600;color:var(--text)}
.route-card.sel .rc-name{color:var(--am-green-text)}
.rc-meta{font-size:11px;color:var(--text3);margin-top:2px}
.rc-dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;color:transparent;transition:all .15s}
.route-card.sel .rc-dot{background:var(--am-green);border-color:var(--am-green);color:#0E1210}

/* Verdict — 4 colors */
.verdict{border-radius:10px;padding:13px 15px;display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.verdict.sev-green{background:var(--sev-green-bg);border:1px solid var(--sev-green-border)}
.verdict.sev-yellow{background:var(--sev-yellow-bg);border:1px solid var(--sev-yellow-border)}
.verdict.sev-orange{background:var(--sev-orange-bg);border:1px solid var(--sev-orange-border)}
.verdict.sev-red{background:var(--sev-red-bg);border:1px solid var(--sev-red-border)}
.v-icon{font-size:26px;line-height:1;flex-shrink:0}
.v-title{font-size:14px;font-weight:600}
.verdict.sev-green .v-title{color:var(--sev-green)}
.verdict.sev-yellow .v-title{color:var(--sev-yellow)}
.verdict.sev-orange .v-title{color:var(--sev-orange)}
.verdict.sev-red .v-title{color:var(--sev-red)}
.v-sub{font-size:12px;margin-top:3px;color:var(--text3)}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 6px;text-align:center}
.stat-val{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:var(--am-green-text)}
.stat-lbl{font-size:10px;color:var(--text3);margin-top:1px}

/* Sun row */
.sun-row{display:flex;gap:7px;margin-bottom:12px}
.sun-box{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 10px;display:flex;align-items:center;gap:8px}
.sun-icon{font-size:18px}
.sun-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.sun-val{font-size:13px;font-weight:600;color:var(--text)}

/* Best time */
.bt-card{background:var(--sev-green-bg);border:1px solid var(--sev-green-border);border-radius:10px;padding:13px 15px;margin-bottom:12px;display:none}
.bt-head{font-size:10px;font-weight:600;color:var(--sev-green);letter-spacing:.08em;text-transform:uppercase;margin-bottom:9px}
.bt-slots{display:flex;flex-direction:column;gap:5px}
.bt-slot{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:7px;border:1px solid var(--sev-green-border)}
.bt-slot.best{background:rgba(76,175,80,.1);border-color:var(--sev-green)}
.bt-l{font-size:12px;font-weight:500;color:var(--text2)}
.bt-slot.best .bt-l{color:var(--sev-green)}
.bt-r{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text3)}
.bt-badge{font-size:10px;font-weight:700;background:var(--am-green-dim);border:1px solid var(--am-green);color:var(--am-green-text);border-radius:4px;padding:2px 7px;letter-spacing:.04em}

/* Checkpoints — 4 colors */
.sec-lbl{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.cp-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.cp{display:flex;align-items:flex-start;gap:9px;padding:10px 11px;border-radius:8px;border:1px solid var(--border);background:var(--surface);transition:opacity .3s,transform .3s}
.cp.cp-new{animation:cpfadein .35s ease forwards}
@keyframes cpfadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cp.sev-green{background:var(--sev-green-bg);border-color:var(--sev-green-border)}
.cp.sev-yellow{background:var(--sev-yellow-bg);border-color:var(--sev-yellow-border)}
.cp.sev-orange{background:var(--sev-orange-bg);border-color:var(--sev-orange-border)}
.cp.sev-red{background:var(--sev-red-bg);border-color:var(--sev-red-border)}
.cp-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0}
.cp.sev-green .cp-dot{background:var(--sev-green)}
.cp.sev-yellow .cp-dot{background:var(--sev-yellow)}
.cp.sev-orange .cp-dot{background:var(--sev-orange)}
.cp.sev-red .cp-dot{background:var(--sev-red)}
.cp-info{flex:1;min-width:0}
.cp-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp.sev-yellow .cp-name{color:var(--sev-yellow)}
.cp.sev-orange .cp-name{color:var(--sev-orange)}
.cp.sev-red .cp-name{color:var(--sev-red)}
.cp-time{font-size:11px;color:var(--text3);margin-top:1px}
.cp-cond{font-size:12px;color:var(--text2);margin-top:3px}
.cp.sev-yellow .cp-cond{color:var(--sev-yellow)}
.cp.sev-orange .cp-cond{color:var(--sev-orange)}
.cp.sev-red .cp-cond{color:var(--sev-red)}
.cp-right{text-align:right;flex-shrink:0;padding-left:6px}
.cp-temp{font-size:13px;font-weight:600;color:var(--text)}
.cp.sev-yellow .cp-temp{color:var(--sev-yellow)}
.cp.sev-orange .cp-temp{color:var(--sev-orange)}
.cp.sev-red .cp-temp{color:var(--sev-red)}
.cp-feels{font-size:10px;color:var(--text3);margin-top:1px}
.cp-wind,.cp-rain{font-size:11px;color:var(--text3);margin-top:2px}
.cp-stop-tag{display:inline-block;font-size:10px;font-weight:600;background:var(--am-green-glow);border:1px solid var(--am-green-dim);color:var(--am-green-text);border-radius:4px;padding:1px 6px;margin-top:3px}

/* Action row */
.action-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.btn-gmaps{flex:1;min-width:140px;padding:11px;background:var(--surface);border:1px solid #4285F4;border-radius:8px;color:#74B2F5;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;font-family:'Inter',sans-serif;transition:all .15s}
.btn-gmaps:hover{background:rgba(66,133,244,.1)}
.btn-copy{flex:1;min-width:120px;padding:11px;background:var(--surface);border:1px solid var(--border2);border-radius:8px;color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;font-family:'Inter',sans-serif;transition:all .15s}
.btn-copy:hover{border-color:var(--am-green);color:var(--am-green-text)}
.btn-reset{padding:11px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text3);font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
.btn-reset:hover{color:var(--text2)}
.copy-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--am-green-dim);border:1px solid var(--am-green);color:var(--am-green-text);padding:9px 18px;border-radius:8px;font-size:13px;font-weight:500;z-index:999;display:none;white-space:nowrap}

@media(max-width:400px){
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .action-row{flex-direction:column}
  .btn-gmaps,.btn-copy{min-width:unset}
}
</style>
</head>
<body>

<div class="app-header">
  <div class="app-logo">
    <svg viewBox="0 0 24 24"><path d="M5 16c0 1.657 1.343 3 3 3s3-1.343 3-3-1.343-3-3-3-3 1.343-3 3zm13 0c0 1.657 1.343 3 3 3s3-1.343 3-3-1.343-3-3-3-3 1.343-3 3zM13 8l-2-4H6L3 8H1v2h2l1 6h14l1-6h2V8h-8zm-5.5 0l1-2h7l1 2H7.5z"/></svg>
  </div>
  <div>
    <div class="app-title">RIDING WEATHER</div>
    <div class="app-sub">Route weather checker · India</div>
  </div>
  <div class="header-right">
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">☀️</button>
  </div>
</div>

<div class="main">

  <!-- INPUT -->
  <div class="card" id="inputCard">
    <div class="card-title">Vehicle</div>
    <div class="vtabs">
      <div class="vtab active" id="vt-bike" onclick="selVehicle('bike')"><span class="vtab-icon">🏍️</span><span class="vtab-label">Bike</span></div>
      <div class="vtab" id="vt-car" onclick="selVehicle('car')"><span class="vtab-icon">🚗</span><span class="vtab-label">Car</span></div>
    </div>

    <div class="card-title">From</div>
    <div class="fg full" style="margin-bottom:6px">
      <div class="input-row">
        <div class="ac-wrap" id="srcWrap">
          <input type="text" id="srcInput" placeholder="Search, paste coords or pin…" autocomplete="off"/>
          <div class="ac-drop" id="srcDrop"></div>
        </div>
        <button class="icon-btn" id="gpsBtn" onclick="useGPS()" title="Use my GPS location">📍</button>
        <button class="icon-btn" id="pinSrcBtn" onclick="startPin('src')" title="Pin on map">🗺️</button>
      </div>
      <div class="fav-chip-row" id="srcFavs"></div>
    </div>

<script>
const WMO={0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Foggy',48:'Icy fog',51:'Light drizzle',53:'Moderate drizzle',55:'Heavy drizzle',61:'Slight rain',63:'Moderate rain',65:'Heavy rain',71:'Slight snow',73:'Moderate snow',75:'Heavy snow',77:'Snow grains',80:'Light showers',81:'Moderate showers',82:'Violent showers',85:'Light snow showers',86:'Heavy snow showers',95:'Thunderstorm',96:'Thunderstorm + hail',99:'Thunderstorm + heavy hail'};
const WX_ICON={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',71:'🌨️',73:'🌨️',75:'❄️',80:'🌦️',81:'🌧️',82:'⛈️',95:'⛈️',96:'⛈️',99:'⛈️'};

// ── State ──
let vehicle='bike',geoSrc=null,geoDst=null,stopGeos=[],stopCount=0;
let leafMap=null,routeData=[],routeLayers=[],wxMarkers=[];
let selRouteIdx=null,pinMode=null;
let resultWpData=[],resultSrc='',resultDst='',resultStops=[];

// ── 4-level severity ──
function severity(code,wind,rain){
  if([65,82,95,96,99,75,86].includes(code)||wind>55||rain>75)return'sev-red';
  if([63,80,81,61,71,73].includes(code)||wind>40||rain>50)return'sev-orange';
  if([51,53,55,45,48].includes(code)||wind>25||rain>25)return'sev-yellow';
  return'sev-green';
}
function sevColor(s){return s==='sev-green'?'#4CAF50':s==='sev-yellow'?'#F0C040':s==='sev-orange'?'#F07820':'#E03030';}

// ── Coordinate detection -- supports 3 formats ──
// 1. DMS:           13deg08min55.3secN 78deg05min20.2secE
// 2. Decimal+dir:   13.148694N, 78.088944E
// 3. Plain decimal: 13.148694, 78.088944
function parseCoords(str){
  const s=str.trim();
  // 1. DMS format
  const dms=s.match(/^(\d{1,3})[^\d](\d{1,2})[^\d]([0-9.]+)[^0-9NS]?([NS])\s+(\d{1,3})[^\d](\d{1,2})[^\d]([0-9.]+)[^0-9EW]?([EW])$/i);
  if(dms){
    let lat=parseFloat(dms[1])+parseFloat(dms[2])/60+parseFloat(dms[3])/3600;
    let lon=parseFloat(dms[5])+parseFloat(dms[6])/60+parseFloat(dms[7])/3600;
    if(dms[4].toUpperCase()==='S')lat=-lat;
    if(dms[8].toUpperCase()==='W')lon=-lon;
    if(lat<-90||lat>90||lon<-180||lon>180)return null;
    return{lat:parseFloat(lat.toFixed(6)),lon:parseFloat(lon.toFixed(6))};
  }
  // 2. Decimal with direction: 13.148694N, 78.088944E
  const decDir=s.match(/^([0-9.]+)\s*([NS])[,\s]+([0-9.]+)\s*([EW])$/i);
  if(decDir){
    let lat=parseFloat(decDir[1]),lon=parseFloat(decDir[3]);
    if(decDir[2].toUpperCase()==='S')lat=-lat;
    if(decDir[4].toUpperCase()==='W')lon=-lon;
    if(lat<-90||lat>90||lon<-180||lon>180)return null;
    return{lat,lon};
  }
  // 3. Plain decimal -- STRICT: both must have decimal point (prevents city name false matches)
  const dec=s.match(/^(-?[0-9]+\.[0-9]+)[,\s]+(-?[0-9]+\.[0-9]+)$/);
  if(dec){
    const lat=parseFloat(dec[1]),lon=parseFloat(dec[2]);
    if(lat<-90||lat>90||lon<-180||lon>180)return null;
    return{lat,lon};
  }
  return null;
}
async function resolveInput(val,storedGeo){
  if(storedGeo)return storedGeo;
  const coords=parseCoords(val);
  if(coords){
    const name=await revGeo(coords.lat,coords.lon);
    return{lat:coords.lat,lon:coords.lon,name,label:val.trim()};
  }
  return await geoFallback(val);
}

function getFavs(){try{return JSON.parse(localStorage.getItem('rwFavs')||'[]');}catch{return[];}}
function saveFav(p){if(!p||!p.name)return;let f=getFavs();if(f.find(x=>x.name===p.name))return;f.unshift(p);if(f.length>8)f=f.slice(0,8);localStorage.setItem('rwFavs',JSON.stringify(f));}
function delFav(name){localStorage.setItem('rwFavs',JSON.stringify(getFavs().filter(f=>f.name!==name)));}
function renderFavs(rowId,onPick){

}

// ── Autocomplete — India focused ──
function makeAC(inpId,dropId,onSel){
  const inp=document.getElementById(inpId),drop=document.getElementById(dropId);
  let timer=null,activeIdx=-1,results=[];
  function close(){drop.style.display='none';activeIdx=-1;}
  function open(){drop.style.display='block';}
  function setHi(i){drop.querySelectorAll('.ac-item').forEach((el,idx)=>el.classList.toggle('hi',idx===i));activeIdx=i;}
  function pick(pl){
    const a=pl.address||{};
    const name=a.city||a.town||a.village||a.county||pl.display_name.split(',')[0];
    const label=pl.display_name.split(',').slice(0,2).join(', ');
    inp.value=label;onSel({lat:parseFloat(pl.lat),lon:parseFloat(pl.lon),name,label});close();
  }
  async function search(q){
    drop.innerHTML='<div class="ac-msg">⟳ Searching…</div>';open();
    try{
      // India first, then fallback to global
      const urlIN='https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(q)+'&limit=6&addressdetails=1&countrycodes=in';
      const r=await fetch(urlIN,{headers:{'User-Agent':'RidingWeatherTool/1.0'}});
      results=await r.json();
      // sort: city > town > village > others
      results.sort((a,b)=>{const rank=x=>({city:0,town:1,village:2}[x.type]??3);return rank(a)-rank(b);});
      if(!results.length){drop.innerHTML='<div class="ac-msg">No places found in India</div>';return;}
      drop.innerHTML='';
      results.forEach((pl,i)=>{
        const a=pl.address||{};
        const main=a.city||a.town||a.village||a.county||pl.display_name.split(',')[0];
        const sub=[a.state_district||a.county,a.state].filter(Boolean).slice(0,2).join(', ');
        const div=document.createElement('div');div.className='ac-item';
        div.innerHTML='<span class="ac-pin">📍</span><div><div class="ac-main">'+main+'</div>'+(sub?'<div class="ac-sub">'+sub+'</div>':'')+'</div>';
        div.addEventListener('mousedown',e=>{e.preventDefault();pick(pl);});
        drop.appendChild(div);
      });
    }catch{drop.innerHTML='<div class="ac-msg">Search failed — check connection</div>';}
  }
  inp.addEventListener('input',()=>{
    onSel(null);clearTimeout(timer);const q=inp.value.trim();
    if(q.length<2){close();return;}
    // If it looks like coordinates, don't search — let resolveInput handle it on submit
    if(parseCoords(q)){close();return;}
    timer=setTimeout(()=>search(q),350);
  });
  inp.addEventListener('keydown',e=>{
    const items=drop.querySelectorAll('.ac-item');
    if(e.key==='ArrowDown'){e.preventDefault();setHi(Math.min(activeIdx+1,items.length-1));}
    else if(e.key==='ArrowUp'){e.preventDefault();setHi(Math.max(activeIdx-1,0));}
    else if(e.key==='Enter'&&activeIdx>=0&&results[activeIdx]){e.preventDefault();pick(results[activeIdx]);}
    else if(e.key==='Escape')close();
  });
  inp.addEventListener('blur',()=>setTimeout(close,160));
}
makeAC('srcInput','srcDrop',p=>{geoSrc=p;});
makeAC('dstInput','dstDrop',p=>{geoDst=p;});

      <input type="text" id="${id}" placeholder="Search, pin or paste coords…" autocomplete="off" style="background:var(--input-bg);border:1px solid var(--border2);border-radius:6px;padding:7px 10px;font-size:13px;width:100%;color:var(--text);outline:none"/>
      <div class="ac-drop" id="stopDrop${idx}"></div>
    </div>
    <button class="stop-pin-btn" onclick="startPin('stop-${idx}')" title="Pin on map">🗺️</button>

// ── GPS ──
function useGPS(){
  const btn=document.getElementById('gpsBtn');btn.textContent='⟳';btn.disabled=true;
  if(!navigator.geolocation){showErr('GPS not supported on this device.');btn.textContent='📍';btn.disabled=false;return;}

// ── Pin on map ──
function startPin(target){

function initBaseMap(){
  if(leafMap)return;
  leafMap=L.map('routeMap',{zoomControl:true,attributionControl:false});

let pinMarker=null;
async function onMapClick(e){
  if(!pinMode)return;
  const{lat,lng}=e.latlng;
  const name=await revGeo(lat,lng);
  const place={lat,lon:lng,name,label:name};

  pinMarker=L.marker([lat,lng],{icon:L.divIcon({html:'<div style="width:14px;height:14px;background:#6BA368;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.5)"></div>',iconSize:[14,14],iconAnchor:[7,7],className:''})}).addTo(leafMap).bindPopup(name).openPopup();
  if(pinMode==='src'){geoSrc=place;document.getElementById('srcInput').value=name;saveFav(place);initFavs();}
  else if(pinMode==='dst'){geoDst=place;document.getElementById('dstInput').value=name;saveFav(place);initFavs();}
  else if(pinMode.startsWith('stop-')){const idx=parseInt(pinMode.split('-')[1]);stopGeos[idx]=place;const inp=document.getElementById('stop'+idx);if(inp)inp.value=name;saveFav(place);}
  pinMode=null;document.getElementById('pinModeBar').style.display='none';
}

// ── Geo helpers ──
async function geoFallback(q){
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(q)+'&limit=1&addressdetails=1&countrycodes=in',{headers:{'User-Agent':'RidingWeatherTool/1.0'}});
  const d=await r.json();
  if(!d.length)throw new Error('Could not find "'+q+'" in India — try picking from suggestions');
  const a=d[0].address||{};
  return{lat:parseFloat(d[0].lat),lon:parseFloat(d[0].lon),name:a.city||a.town||a.village||a.county||d[0].display_name.split(',')[0],label:d[0].display_name.split(',').slice(0,2).join(', ')};
}
async function revGeo(lat,lon){
  try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`,{headers:{'User-Agent':'RidingWeatherTool/1.0'}});const d=await r.json();const a=d.address||{};return a.city||a.town||a.village||a.county||a.state_district||a.state||(lat.toFixed(3)+','+lon.toFixed(3));}
  catch{return lat.toFixed(3)+','+lon.toFixed(3);}
}

// ── OSRM ──
async function getRoutes(waypoints,profile){
  const coords=waypoints.map(p=>p.lon+','+p.lat).join(';');
  const url=`https://router.project-osrm.org/route/v1/${profile==='bike'?'bike':'car'}/${coords}?alternatives=true&overview=full&geometries=geojson`;
  const r=await fetch(url);const d=await r.json();
  if(d.code!=='Ok'||!d.routes.length)throw new Error('No route found. Try different locations.');
  return d.routes.map(rt=>({geometry:rt.geometry.coordinates,distanceKm:Math.round(rt.distance/1000),durationMin:Math.round(rt.duration/60)}));
}

// ── Find routes ──
async function findRoutes(){
  const srcVal=document.getElementById('srcInput').value.trim();
  const dstVal=document.getElementById('dstInput').value.trim();
  const date=document.getElementById('dt').value;
  const time=document.getElementById('tm').value;
  if(!srcVal||!dstVal||!date||!time){showErr('Please fill in From, To, date and time.');return;}
  document.getElementById('findBtn').disabled=true;
  document.getElementById('resultsSection').style.display='none';
  clearErr();showProgress('Finding locations…');
  try{
    if(!geoSrc)geoSrc=await resolveInput(srcVal,null);
    if(!geoDst)geoDst=await resolveInput(dstVal,null);
    saveFav(geoSrc);saveFav(geoDst);initFavs();
    const activeStops=[];
    for(let i=0;i<stopCount;i++){
      const row=document.getElementById('stoprow'+i);if(!row)continue;
      const inp=document.getElementById('stop'+i);if(!inp||!inp.value.trim())continue;
      if(!stopGeos[i])stopGeos[i]=await resolveInput(inp.value.trim(),null);
      activeStops.push(stopGeos[i]);
    }
    document.getElementById('progressTitle').textContent='Calculating routes…';
    const waypoints=[geoSrc,...activeStops,geoDst];
    const routes=await getRoutes(waypoints,vehicle);
    const byDur=[...routes].sort((a,b)=>a.durationMin-b.durationMin);
    const byDist=[...routes].sort((a,b)=>a.distanceKm-b.distanceKm);
    routeData=[];const seen=new Set();
    const labels=[{label:'Fastest',icon:'⚡'},{label:'Shortest',icon:'📏'},{label:'Alternative',icon:'🔀'}];
    let li=0;
    [byDur[0],byDist[0],...routes].forEach(rt=>{
      if(!rt||seen.has(rt.distanceKm+'-'+rt.durationMin))return;
      seen.add(rt.distanceKm+'-'+rt.durationMin);
      routeData.push({...rt,...(labels[li++]||{label:'Option',icon:'🛣️'})});
    });
    document.getElementById('routeSection').style.display='block';
    drawMap(routeData,waypoints);
    const container=document.getElementById('routeCards');container.innerHTML='';
    routeData.forEach((rt,i)=>{
      const h=Math.floor(rt.durationMin/60),m=rt.durationMin%60;
      const dur=h>0?h+'h '+m+'m':m+'m';
      const div=document.createElement('div');div.className='route-card';
      div.innerHTML=`<div class="rc-badge">${rt.icon} ${rt.label}</div><div class="rc-info"><div class="rc-name">${rt.distanceKm} km &nbsp;·&nbsp; ${dur}</div><div class="rc-meta">Tap to select</div></div><div class="rc-dot">✓</div>`;
      div.addEventListener('click',()=>selRoute(i));container.appendChild(div);
    });
    hideProgress();selRoute(0);
    document.getElementById('routeSection').scrollIntoView({behavior:'smooth',block:'start'});
  }catch(e){hideProgress();showErr(e.message);}
  document.getElementById('findBtn').disabled=false;
}

// ── Map drawing ──
function drawMap(routes,waypoints){
  if(leafMap){leafMap.remove();leafMap=null;}
  leafMap=L.map('routeMap',{zoomControl:true,attributionControl:false});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(leafMap);
  leafMap.on('click',onMapClick);
  const colors=['#6BA368','#4A9EFF','#FFB347'];
  routeLayers=[];wxMarkers=[];
  routes.forEach((rt,i)=>{
    const ll=rt.geometry.map(c=>[c[1],c[0]]);
    const layer=L.polyline(ll,{color:colors[i]||'#888',weight:i===0?5:3.5,opacity:i===0?1:0.45}).addTo(leafMap);
    routeLayers.push(layer);layer.on('click',()=>selRoute(i));
  });
  const mkSrc=L.divIcon({html:'<div style="width:14px;height:14px;background:#4CAF50;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.6)"></div>',iconSize:[14,14],iconAnchor:[7,7],className:''});
  const mkDst=L.divIcon({html:'<div style="width:14px;height:14px;background:#E03030;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.6)"></div>',iconSize:[14,14],iconAnchor:[7,7],className:''});
  const mkStop=L.divIcon({html:'<div style="width:11px;height:11px;background:#F07820;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.5)"></div>',iconSize:[11,11],iconAnchor:[5,5],className:''});
  waypoints.forEach((wp,i)=>{
    const icon=i===0?mkSrc:i===waypoints.length-1?mkDst:mkStop;
    L.marker([wp.lat,wp.lon],{icon}).addTo(leafMap).bindPopup('<strong>'+wp.name+'</strong>');
  });
  const allPts=routes.flatMap(r=>r.geometry.map(c=>[c[1],c[0]]));
  leafMap.fitBounds(L.latLngBounds(allPts).pad(0.12));
}

function selRoute(i){
  selRouteIdx=i;
  document.querySelectorAll('.route-card').forEach((el,idx)=>{el.classList.toggle('sel',idx===i);el.querySelector('.rc-dot').style.color=idx===i?'#0E1210':'transparent';});
  routeLayers.forEach((l,idx)=>{l.setStyle({weight:idx===i?6:3.5,opacity:idx===i?1:0.3});if(idx===i)l.bringToFront();});
  document.getElementById('checkBtn').disabled=false;
}

// ── Add weather markers to map ──
function addWxMarker(lat,lon,sev,wxCode,temp,name,time){
  const icon=WX_ICON[wxCode]||'🌡️';
  const color=sevColor(sev);
  const html=`<div class="wx-marker"><div class="wx-bubble ${sev}" style="border-color:${color}">${icon}</div><div class="wx-stem ${sev}" style="background:${color}"></div></div>`;
  const mk=L.marker([lat,lon],{icon:L.divIcon({html,iconSize:[36,44],iconAnchor:[18,44],className:''})}).addTo(leafMap);
  mk.bindPopup(`<div class="wx-popup"><strong>${name}</strong>${time}<br>${WMO[wxCode]||'—'}<br>🌡️ ${temp}°C</div>`);
  wxMarkers.push(mk);
}

// ── Weather fetch ──
function interpRoute(geometry,stepKm){
  const R=6371;
  function dist(a,b){const la1=a[1]*Math.PI/180,lo1=a[0]*Math.PI/180,la2=b[1]*Math.PI/180,lo2=b[0]*Math.PI/180;const x=Math.sin((la2-la1)/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin((lo2-lo1)/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
  const pts=[{coord:geometry[0],km:0}];let acc=0,prev=geometry[0],lastSample=0;
  for(let i=1;i<geometry.length;i++){acc+=dist(prev,geometry[i]);if(acc-lastSample>=stepKm){pts.push({coord:geometry[i],km:Math.round(acc)});lastSample=acc;}prev=geometry[i];}
  const last=geometry[geometry.length-1];if(pts[pts.length-1].coord!==last)pts.push({coord:last,km:Math.round(acc)});
  return{pts,totalKm:Math.round(acc)};
}
async function fetchWx(lat,lon,date,hour){
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,apparent_temperature,weathercode,windspeed_10m,precipitation_probability&daily=sunrise,sunset&timezone=auto&start_date=${date}&end_date=${date}`;
  const r=await fetch(u);const d=await r.json();const i=Math.min(Math.max(hour,0),23);
  return{temp:Math.round(d.hourly.temperature_2m[i]),feels:Math.round(d.hourly.apparent_temperature[i]),code:d.hourly.weathercode[i],wind:Math.round(d.hourly.windspeed_10m[i]),rain:Math.round(d.hourly.precipitation_probability[i]),sunrise:d.daily?.sunrise?.[0]?.split('T')[1]||'—',sunset:d.daily?.sunset?.[0]?.split('T')[1]||'—'};
}
async function fetchDayWx(lat,lon,date){
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=weathercode,windspeed_10m,precipitation_probability&timezone=auto&start_date=${date}&end_date=${date}`;
  const r=await fetch(u);return(await r.json()).hourly;
}
function fmtTime(h,m){return String(h).padStart(2,'0')+':'+String(Math.round(m)%60).padStart(2,'0');}

async function checkWeather(){
  if(selRouteIdx===null)return;
  const rt=routeData[selRouteIdx];
  const date=document.getElementById('dt').value;
  const time=document.getElementById('tm').value;
  const spd=parseFloat(document.getElementById('spd').value)||60;
  document.getElementById('checkBtn').disabled=true;
  document.getElementById('resultsSection').style.display='none';
  document.getElementById('cpList').innerHTML='';
  clearErr();

  // Clear old wx markers
  wxMarkers.forEach(m=>leafMap&&leafMap.removeLayer(m));wxMarkers=[];

  const stepKm=rt.distanceKm<=80?10:15;
  const{pts,totalKm}=interpRoute(rt.geometry,stepKm);
  const[sh,sm]=time.split(':').map(Number);
  const startMin=sh*60+sm;
  const activeStopGeos=stopGeos.filter(Boolean);
  function isNearStop(lat,lon){return activeStopGeos.some(s=>Math.abs(s.lat-lat)<0.05&&Math.abs(s.lon-lon)<0.05);}

  showProgress('Fetching weather along route…');
  document.getElementById('resultsSection').style.display='block';
  document.getElementById('resultsSection').scrollIntoView({behavior:'smooth',block:'start'});

  const wpData=[];
  let sunriseStr='—',sunsetStr='—';
  try{
    for(let i=0;i<pts.length;i++){
      const p=pts[i];const[lon,lat]=[p.coord[0],p.coord[1]];
      const travMin=(p.km/spd)*60;
      const arrMin=startMin+travMin;
      const arrH=Math.min(Math.floor(arrMin/60),23);
      const arrM=arrMin%60;
      const name=i===0?geoSrc.name:(i===pts.length-1?geoDst.name:await revGeo(lat,lon));
      updateProgress(i+1,pts.length,name);
      const w=await fetchWx(lat,lon,date,arrH);
      if(i===0){sunriseStr=w.sunrise;sunsetStr=w.sunset;}
      const sev=severity(w.code,w.wind,w.rain);
      const isStop=isNearStop(lat,lon)&&i!==0&&i!==pts.length-1;
      const timeStr=fmtTime(arrH,arrM);
      wpData.push({name,km:p.km,time:timeStr,w,sev,isStop});

      // Add wx marker to map
      if(leafMap)addWxMarker(lat,lon,sev,w.code,w.temp,name,timeStr);

      // Live render checkpoint card
      const cpEl=document.getElementById('cpList');
      const div=document.createElement('div');
      div.className='cp '+sev+' cp-new';
      div.innerHTML=`<div class="cp-dot"></div><div class="cp-info"><div class="cp-name">${name}</div><div class="cp-time">${timeStr} · ${p.km} km from start</div><div class="cp-cond">${WMO[w.code]||'Unknown'}${isStop?'<div class="cp-stop-tag">📍 Your stop</div>':''}</div></div><div class="cp-right"><div class="cp-temp">${w.temp}°C</div><div class="cp-feels">Feels ${w.feels}°C</div><div class="cp-wind">💨 ${w.wind} km/h</div><div class="cp-rain">🌧 ${w.rain}%</div></div>`;
      cpEl.appendChild(div);
    }

    resultWpData=wpData;resultSrc=geoSrc.label||geoSrc.name;resultDst=geoDst.label||geoDst.name;resultStops=stopGeos.filter(Boolean).map(s=>s.label||s.name);

    const alerts=wpData.filter(x=>x.sev!=='sev-green').length;
    const reds=wpData.filter(x=>x.sev==='sev-red').length;
    const oranges=wpData.filter(x=>x.sev==='sev-orange').length;
    const maxRain=Math.max(...wpData.map(x=>x.w.rain));

    document.getElementById('sDist').textContent=totalKm;
    document.getElementById('sStops').textContent=pts.length;
    document.getElementById('sAlerts').textContent=alerts;
    document.getElementById('sRain').textContent=maxRain+'%';

    document.getElementById('sunriseVal').textContent=sunriseStr;
    document.getElementById('sunsetVal').textContent=sunsetStr;
    document.getElementById('sunRow').style.display='flex';

    // Verdict — 4 level
    const vc=document.getElementById('vcard');vc.className='verdict';
    if(reds>=2){vc.classList.add('sev-red');document.getElementById('vicon').textContent='⛔';document.getElementById('vtitle').textContent='Dangerous — avoid riding';document.getElementById('vsub').textContent=reds+' severe storm/rain zones on your route. Reschedule.';}
    else if(oranges>=2||reds>=1){vc.classList.add('sev-orange');document.getElementById('vicon').textContent='🟠';document.getElementById('vtitle').textContent='High caution — bad weather ahead';document.getElementById('vsub').textContent='Heavy rain or strong winds on route. Carry full rain gear.';}
    else if(alerts>0){vc.classList.add('sev-yellow');document.getElementById('vicon').textContent='⚠️';document.getElementById('vtitle').textContent='Ride with caution';document.getElementById('vsub').textContent=alerts+' weather concern'+(alerts>1?'s':'')+' on route. Carry rain gear.';}
    else{vc.classList.add('sev-green');document.getElementById('vicon').textContent='✅';document.getElementById('vtitle').textContent='Good to go!';document.getElementById('vsub').textContent='Clear skies along your entire route. Enjoy the ride!';}

    // Best time
    const mid=Math.floor(pts.length/2);const[mlon,mlat]=[pts[mid].coord[0],pts[mid].coord[1]];
    const h=await fetchDayWx(mlat,mlon,date);
    const slots=[{l:'Early morning',s:5,e:8},{l:'Morning',s:8,e:11},{l:'Midday',s:11,e:14},{l:'Afternoon',s:14,e:17},{l:'Evening',s:17,e:20}];
    const scored=slots.map(sl=>{
      let sc=0;for(let hh=sl.s;hh<sl.e;hh++){const sv=severity(h.weathercode[hh],h.windspeed_10m[hh],h.precipitation_probability[hh]);sc+=(sv==='sev-green'?0:sv==='sev-yellow'?1:sv==='sev-orange'?2:3);}
      const cnt=sl.e-sl.s;const avgRain=Math.round(h.precipitation_probability.slice(sl.s,sl.e).reduce((a,b)=>a+b,0)/cnt);
      return{...sl,score:sc/cnt,avgRain};
    }).sort((a,b)=>a.score-b.score);
    const btEl=document.getElementById('btSlots');btEl.innerHTML='';
    scored.forEach((sl,i)=>{
      const icon=sl.score===0?'✅':sl.score<1?'🟡':sl.score<2?'🟠':'🔴';
      const div=document.createElement('div');div.className='bt-slot'+(i===0?' best':'');
      div.innerHTML=`<span class="bt-l">${icon} ${sl.l} (${String(sl.s).padStart(2,'0')}:00–${String(sl.e).padStart(2,'0')}:00)</span><span class="bt-r">🌧 ${sl.avgRain}%${i===0?' <span class="bt-badge">BEST</span>':''}</span>`;
      btEl.appendChild(div);
    });
    document.getElementById('btCard').style.display='block';
    hideProgress();
  }catch(e){hideProgress();showErr(e.message);}
  document.getElementById('checkBtn').disabled=false;
}

// ── Build Google Maps URL ──
function buildMapsURL(){
  const mode=vehicle==='bike'?'bicycling':'driving';
  const src=geoSrc.lat+','+geoSrc.lon;
  const dst=geoDst.lat+','+geoDst.lon;
  const activeStops=stopGeos.filter(Boolean);
  let waypointsParam='';
  if(routeData[selRouteIdx]){
    const geom=routeData[selRouteIdx].geometry;
    const step=Math.max(1,Math.floor(geom.length/8));
    const sampled=[];
    for(let i=step;i<geom.length-1;i+=step)sampled.push(geom[i][1].toFixed(5)+','+geom[i][0].toFixed(5));
    activeStops.forEach(s=>sampled.push(s.lat+','+s.lon));
    if(sampled.length)waypointsParam='&waypoints='+sampled.join('|');
  }
  return`https://www.google.com/maps/dir/?api=1&origin=${src}&destination=${dst}${waypointsParam}&travelmode=${mode}`;
}

// ── Share to Google Maps ──
function shareRoute(){window.open(buildMapsURL(),'_blank');}

// ── Share link button ──
function shareLink(){
  const url=buildMapsURL();
  if(navigator.share){
    navigator.share({title:'Riding Weather Route',text:'Check out my ride route 🏍️',url}).catch(()=>{});
  }else{
    navigator.clipboard.writeText(url).then(()=>{
      const t=document.getElementById('copyToast');
      t.textContent='🔗 Google Maps link copied!';
      t.style.display='block';
      setTimeout(()=>{t.style.display='none';t.textContent='✓ Copied to clipboard';},2400);
    });
  }
}

// ── Copy summary ──
function copyRoute(){
  const date=document.getElementById('dt').value,time=document.getElementById('tm').value;
  const rt=routeData[selRouteIdx];
  const mapsURL=buildMapsURL();
  let txt='🏍️ RIDING WEATHER SUMMARY\n──────────────────────\n';
  txt+=`🗺️ Google Maps: ${mapsURL}\n──────────────────────\n`;
  txt+=`From : ${resultSrc}\n`;if(resultStops.length)txt+=`Stops: ${resultStops.join(' → ')}\n`;
  txt+=`To   : ${resultDst}\nDate : ${date}  Start: ${time}\n`;
  txt+=`Route: ${rt?.label||''} · ${rt?.distanceKm||'—'} km\n`;
  txt+=`🌅 Sunrise: ${document.getElementById('sunriseVal').textContent}  🌇 Sunset: ${document.getElementById('sunsetVal').textContent}\n──────────────────────\n`;
  const alerts=resultWpData.filter(w=>w.sev!=='sev-green');
  if(!alerts.length)txt+='✅ Clear weather along entire route\n';
  else{txt+='⚠️ Weather alerts:\n';alerts.forEach(w=>{txt+=`  • ${w.name} at ${w.time} — ${WMO[w.w.code]||'Bad weather'}, Rain: ${w.w.rain}%\n`;});}
  txt+='──────────────────────\nFull checkpoints:\n';
  resultWpData.forEach(w=>{txt+=`  ${w.time} ${w.name} — ${w.w.temp}°C (feels ${w.w.feels}°C), 💨${w.w.wind}km/h, 🌧${w.w.rain}%\n`;});
  navigator.clipboard.writeText(txt).then(()=>{const t=document.getElementById('copyToast');t.style.display='block';setTimeout(()=>t.style.display='none',2200);});
}

// ── Reset ──
function resetTool(){
  document.getElementById('srcInput').value='';document.getElementById('dstInput').value='';
  document.getElementById('stopsList').innerHTML='';
  geoSrc=null;geoDst=null;stopGeos=[];stopCount=0;selRouteIdx=null;routeData=[];
  document.getElementById('routeSection').style.display='none';
  document.getElementById('resultsSection').style.display='none';
  document.getElementById('errBox').style.display='none';
  document.getElementById('addStopBtn').style.display='flex';
  hideProgress();if(leafMap){leafMap.remove();leafMap=null;}
  window.scrollTo({top:0,behavior:'smooth'});
}
